<footer>
  <!--line boundary-->
  <span aria-hidden="true" class="h-px flex-1 bg-border"></span>

  <div
    class="mx-auto flex w-full max-w-6xl flex-col items-center gap-5 px-4 pt-12 pb-8 sm:flex-row sm:justify-between"
  >
    <p class="text-sm text-muted-foreground">&copy; {{ currentYear }} Rowel Razonable</p>

    <nav aria-label="Social and contact links" class="flex items-center gap-2">
      <!--Github-->
      <a
        [href]="myContact.myGithubLink"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub (opens in a new tab)"
        class="inline-flex size-11 items-center justify-center rounded-md focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring"
      >
        <img ngSrc="/github-logo.svg" width="24" height="24" alt="" class="size-6 invert" />
      </a>
      <!--Linkedin-->
      <a
        [href]="myContact.myLinkedinLink"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="LinkedIn (opens in a new tab)"
        class="inline-flex size-11 items-center justify-center rounded-md focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring"
      >
        <img ngSrc="/linkedin-logo.svg" width="24" height="24" alt="" class="size-6 invert" />
      </a>
      <!--Email-->
      <a
        [href]="'mailto:' + myContact.myEmail"
        aria-label="Send an email to Rowel"
        class="inline-flex size-11 items-center justify-center rounded-md text-foreground focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring"
      >
        <span
          class="inline-flex size-6 items-center justify-center rounded-full bg-foreground text-background"
        >
          <ng-icon name="lucideMail" size="15px" aria-hidden="true" />
        </span>
      </a>
      <!--Facebook-->
      <a
        [href]="myContact.myFacebookLink"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Facebook (opens in a new tab)"
        class="inline-flex size-11 items-center justify-center rounded-md focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring"
      >
        <img ngSrc="/facebook-logo.svg" width="24" height="24" alt="" class="size-6 invert" />
      </a>
    </nav>
  </div>
</footer>
