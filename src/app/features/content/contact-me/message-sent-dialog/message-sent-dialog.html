<brn-dialog
  #messageDialog="brnDialog"
  [state]="open() ? 'open' : 'closed'"
  (stateChanged)="onStateChanged($event)"
  aria-labelledby="message-sent-title"
  aria-describedby="message-sent-description"
  [restoreFocus]="'#contact-submit'"
>
  <brn-dialog-overlay class="bg-black/60" />
  <ng-template brnDialogContent>
    <div
      [attr.data-state]="messageDialog.stateComputed()"
      class="message-sent-panel max-h-[calc(100dvh-2rem)] w-[calc(100vw-2rem)] max-w-lg overflow-y-auto rounded-xl border border-border bg-card p-6 text-center text-card-foreground shadow-lg sm:p-10"
    >
      <ng-icon name="lucideCircleCheck" size="48px" class="text-[#22c55e]" aria-hidden="true" />
      <h2 id="message-sent-title" class="mt-4 text-2xl font-semibold">Message sent</h2>
      <p id="message-sent-description" class="mt-3 leading-relaxed text-muted-foreground">
        I’ve received your message. I’ll take a look and get back to you.
      </p>
      <button
        hlmBtn
        brnDialogClose
        type="button"
        class="mt-6 bg-[#22c55e] px-8 text-[#020617] hover:bg-green-500 hover:text-[#020617]"
      >
        Ok
      </button>
    </div>
  </ng-template>
</brn-dialog>
