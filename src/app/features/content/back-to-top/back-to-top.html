@if (showButton()) {
  <a
    hlmBtn
    animate.enter="button-enter"
    animate.leave="button-leave"
    href="#about-me"
    variant="default"
    size="icon-lg"
    aria-label="Back to top"
    class="shadow-drop-green-animation fixed right-4 bottom-4 z-50 size-12 rounded-full bg-(--color-green) text-[#020617] hover:bg-green-600 hover:text-[#020617] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring sm:right-6 sm:bottom-6 sm:size-16"
  >
    <ng-icon name="lucideArrowUp" size="24px" class="text-[24px]" aria-hidden="true" />
  </a>
}
