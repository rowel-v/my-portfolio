<section id="about-me" class="grid gap-3 py-10 sm:gap-13 sm:py-16 md:grid-cols-2 md:py-12">
  <!---->
  <div class="flex flex-col justify-between gap-10 md:gap-0">
    <!---->
    <div class="flex items-center justify-between gap-3 sm:gap-8">
      <div class="flex min-w-0 items-center gap-3 sm:gap-3">
        <a
          href="#about-me"
          aria-label="Go to the top of the page"
          class="rounded-full focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring"
        >
          <hlm-avatar class="shadow-drop-green-animation size-12">
            <span hlmAvatarFallback class="bg-(--color-green) text-[22px] text-background">
              R
            </span>
          </hlm-avatar>
        </a>
        <h1
          class="text-2xl font-bold text-primary sm:text-3xl"
          style="font-family: 'Buda', sans-serif"
        >
          Rowel
        </h1>
        <!-- <button
          hlmBtn
          variant="outline"
          size="lg"
          class="shadow-drop-green-animation h-12 border border-(--color-green) px-4 text-base sm:h-14 sm:px-10 sm:text-lg"
        >
          View Resume
        </button> -->
      </div>

      <brn-popover #notePopover="brnPopover" align="end" sideOffset="8" [role]="null">
        <button
          hlmBtn
          brnPopoverTrigger
          variant="ghost"
          size="icon-lg"
          class="shadow-drop-green-animation translate-y-1 sm:-me-3"
          aria-label="A note from me"
        >
          <ng-icon
            name="lucideBadgeInfo"
            size="50px"
            aria-hidden="true"
            color="var(--color-green)"
            class="color-shift-animation"
          />
        </button>
        <ng-template brnPopoverContent>
          <app-info (closed)="notePopover.close()" />
        </ng-template>
      </brn-popover>
    </div>
    <!---->
    <div class="flex flex-col">
      <h1
        class="text-4xl leading-tight font-bold tracking-wider text-primary sm:text-5xl md:mt-10"
        style="font-family: 'Buda', sans-serif"
      >
        Hello, I’m
        <br />
        Rowel Razonable
      </h1>

      <p class="mt-6 max-w-xl text-lg leading-relaxed text-muted-foreground sm:text-[22px]">
        I’m a full-stack Java developer building practical web applications with usability and
        reliability in mind.
      </p>
    </div>

    <div></div>
  </div>

  <div class="">
    <img
      ngSrc="/rowel-photo.jpg"
      width="1100"
      height="984"
      priority
      alt="Rowel Razonable"
      class="mx-auto w-full max-w-60 rounded-lg object-cover shadow-[0_-18px_40px_-8px_rgba(34,197,94,0.6),18px_0_40px_-8px_rgba(221,0,49,0.6)] md:max-w-none"
    />
  </div>
</section>

<section>
  <div class="flex flex-col items-start gap-4 lg:flex-row lg:items-center lg:justify-between">
    <div class="flex flex-col items-start gap-2 sm:flex-row sm:flex-wrap sm:gap-x-4 lg:gap-12">
      <!--Email-->
      <a
        hlmBtn
        variant="link"
        size="lg"
        [href]="'mailto:' + myContact.myEmail"
        class="gap-3 px-0 text-base sm:text-xl"
      >
        <ng-icon name="lucideMail" size="24px" aria-hidden="true" color="var(--color-green)" />
        rowel.b.razonable@gmail.com
      </a>

      <!--Phone number-->
      <a
        hlmBtn
        variant="link"
        size="lg"
        [href]="'tel:' + myContact.myPhoneNumber"
        class="gap-3 px-0 text-base sm:text-xl"
      >
        <ng-icon name="lucidePhone" size="24px" aria-hidden="true" color="var(--color-green)" />
        09674 128 269
      </a>
    </div>

    <div class="flex flex-row gap-2">
      <!--github-->
      <a
        hlmBtn
        variant="link"
        size="icon"
        [href]="myContact.myGithubLink"
        target="_blank"
        class="text-xl"
      >
        <img
          src="/tech-stack/contact/github-logo.svg"
          class="invert"
          width="28"
          height="28"
          alt=""
        />
      </a>

      <!--linkedin-->
      <a hlmBtn variant="link" size="icon" [href]="myContact.myLinkedinLink" target="_blank">
        <img
          src="/tech-stack/contact/linkedin-logo.svg"
          class="invert"
          width="28"
          height="28"
          alt=""
        />
      </a>

      <!--facebook-->
      <a hlmBtn variant="link" size="icon" [href]="myContact.myFacebookLink" target="_blank">
        <img
          src="/tech-stack/contact/facebook-logo.svg"
          class="invert"
          width="28"
          height="28"
          alt=""
        />
      </a>
    </div>
  </div>
</section>

<section aria-label="Portfolio highlights" class="pt-10">
  <div class="grid gap-4 pt-3 sm:grid-cols-3">
    <div class="shadow-drop-red-animation rounded-md border-border bg-card p-6">
      <p class="text-3xl font-semibold tracking-tight text-card-foreground">01</p>
      <p class="mt-2 text-sm text-muted-foreground">Completed Project</p>
    </div>

    <div class="shadow-drop-red-animation rounded-md border-border bg-card p-6">
      <p class="text-2xl font-semibold tracking-tight text-card-foreground">Full Stack</p>
      <p class="mt-2 text-sm text-muted-foreground">
        <span class="text-(--color-green)">Java</span>
        &amp;
        <span class="text-(--color-red)">Angular</span>
      </p>
    </div>

    <div class="shadow-drop-red-animation rounded-md border-border bg-card p-6">
      <p class="text-2xl font-semibold tracking-tight text-card-foreground">Open to Work</p>
      <p class="mt-2 text-sm text-muted-foreground">Freelance Opportunities</p>
    </div>
  </div>
</section>
