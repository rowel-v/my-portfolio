<section id="what-i-can-build" class="group/services">
  <a href="#what-i-can-build" class="inline-block">
    <app-header-label label="What I Can Build" />
  </a>

  <ul class="mt-6 grid sm:mt-8 sm:grid-cols-2 sm:gap-x-10">
    @for (myOffer of myOffers; track myOffer.id) {
      <li
        class="group grid min-h-24 grid-cols-[auto_minmax(0,1fr)] content-start gap-x-3 border-t border-border px-0 py-4 hover:rounded-md hover:bg-muted/40 focus-visible:bg-muted/40 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring sm:px-4 sm:py-5"
      >
        <!--bullet-->
        <span
          aria-hidden="true"
          class="col-start-1 row-start-1 mt-1.5 flex size-3 items-center justify-center rounded-full border border-(--color-green)"
        >
          <span class="size-2 rounded-full bg-(--color-green)"></span>
        </span>

        <h3
          class="col-start-2 row-start-1 text-lg font-medium text-foreground transition-[opacity,transform,visibility] duration-500 ease-in-out select-none group-hover:invisible group-hover:-translate-y-1 group-hover:opacity-0 group-focus-visible:invisible group-focus-visible:-translate-y-1 group-focus-visible:opacity-0 motion-reduce:transition-none"
        >
          {{ myOffer.title }}
        </h3>

        <p
          class="invisible col-start-2 row-start-1 translate-y-1 text-sm text-[16px] leading-relaxed text-muted-foreground opacity-0 transition-[opacity,transform,visibility] duration-500 ease-in-out select-none group-hover:visible group-hover:translate-y-0 group-hover:opacity-100 group-focus-visible:visible group-focus-visible:translate-y-0 group-focus-visible:opacity-100 group-focus-within/services:visible group-focus-within/services:row-start-2 group-focus-within/services:mt-2 group-focus-within/services:translate-y-0 group-focus-within/services:opacity-100 motion-reduce:transition-none [@media(hover:none)]:visible [@media(hover:none)]:row-start-2 [@media(hover:none)]:mt-2 [@media(hover:none)]:translate-y-0 [@media(hover:none)]:opacity-100"
        >
          {{ myOffer.description }}
        </p>
      </li>
    }
  </ul>
</section>
