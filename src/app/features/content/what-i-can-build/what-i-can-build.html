<section class="">
  <h2 class="text-[26px] font-semibold tracking-tight text-primary">What I Can Build</h2>

  <ul class="mt-8 grid sm:grid-cols-2 sm:gap-x-10">
    @for (myOffer of myOffers; track myOffer.id) {
      <li
        class="group grid min-h-24 content-start border-t border-border py-5 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring hover:bg-muted/40 focus-visible:bg-muted/40 px-4 hover:rounded-md"
      >
        <h3
          class="col-start-1 row-start-1 text-lg font-medium text-foreground transition-[opacity,transform,visibility] duration-500 ease-in-out group-hover:invisible group-hover:-translate-y-1 group-hover:opacity-0 group-focus-visible:invisible group-focus-visible:-translate-y-1 group-focus-visible:opacity-0 motion-reduce:transition-none select-none"
        >
          {{ myOffer.title }}
        </h3>

        <p
          class="invisible col-start-1 row-start-1 translate-y-1 text-sm leading-relaxed text-muted-foreground opacity-0 transition-[opacity,transform,visibility] duration-500 ease-in-out group-hover:visible group-hover:translate-y-0 group-hover:opacity-100 group-focus-visible:visible group-focus-visible:translate-y-0 group-focus-visible:opacity-100 motion-reduce:transition-none text-[16px] select-none"
        >
          {{ myOffer.description }}
        </p>
      </li>
    }
  </ul>
</section>
